name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/minimal-token-web-build-5b228s"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node for Film Studio
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio-film-ai/package-lock.json
      - name: Build imported Film Studio
        run: |
          npm ci --prefix studio-film-ai --no-audit --no-fund
          npm run --prefix studio-film-ai typecheck
          npm run --prefix studio-film-ai build
          python3 scripts/publish-film-studio.py
      - name: Sync feature catalog, landing page and SEO
        run: |
          python3 scripts/sync-catalog.py
          python3 scripts/check-site.py
      - name: Stage runtime files
        run: python3 scripts/stage-pages.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ".pages"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
